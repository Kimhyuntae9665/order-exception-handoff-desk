name: CPU contract checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: python3 scripts/verify-freeze.py
      - run: node scripts/same-instance-extension.mjs
